<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>HK One Touch - Quản Lý Sửa Chữa</title>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HK One Touch" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-v2-192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-v2-192.png" />
    <link rel="apple-touch-icon" href="/icon-v2-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-v2-192.png" />

    <!-- Google Fonts: Inter + Material Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

    <style>
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      /* Ngăn pull-to-refresh trên mobile */
      html, body {
        overscroll-behavior: none;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        overflow: hidden;
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: #1e1b4b;
        position: fixed;
      }
      #root {
        height: 100%;
        width: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        background: #f8fafc;
      }
    </style>
    <script>
      // Chặn F5, Ctrl+R refresh
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F5' || (e.ctrlKey && e.key === 'r') || (e.ctrlKey && e.key === 'R')) {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey && (e.key === 'w' || e.key === 'W')) {
          e.preventDefault();
          return false;
        }
      });

      // Chặn context menu (chuột phải)
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // Wake Lock - ngăn màn hình tắt
      async function requestWakeLock() {
        if ('wakeLock' in navigator) {
          try {
            window._wakeLock = await navigator.wakeLock.request('screen');
            document.addEventListener('visibilitychange', async () => {
              if (document.visibilityState === 'visible' && window._wakeLock?.released) {
                window._wakeLock = await navigator.wakeLock.request('screen');
              }
            });
          } catch (e) {}
        }
      }
      requestWakeLock();

      // Chặn back thoát app
      window.addEventListener('load', function() {
        history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function() {
          history.pushState(null, '', window.location.href);
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
