name: Refresh knowledge graph

# Mỗi lần code được push lên main (Vercel cũng deploy theo đúng lần push này),
# tự dựng lại knowledge graph Graphify và cập nhật public/graph.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graph-refresh
  cancel-in-progress: true

jobs:
  graph:
    # Bỏ qua chính commit do bot này tạo ra (tránh vòng lặp vô hạn)
    if: ${{ !contains(github.event.head_commit.message, '[graph-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install graphify
        run: pip install --quiet graphifyy

      - name: Build graph (code only, no LLM)
        run: |
          graphify extract . --code-only
          graphify cluster-only . --no-label

      - name: Publish graph.html
        run: |
          mkdir -p public
          cp graphify-out/graph.html public/graph.html

      - name: Commit and push
        run: |
          git config user.name "graphify-bot"
          git config user.email "graphify-bot@users.noreply.github.com"
          git add public/graph.html
          if git diff --cached --quiet; then
            echo "Graph không thay đổi, bỏ qua commit."
          else
            git commit -m "chore: refresh knowledge graph [graph-refresh]"
            git push
          fi
